<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบจัดการสต็อก</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .role-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 5px;
        }
        .role-admin {
            background: #3498db;
            color: white;
        }
        .role-staff {
            background: #2ecc71;
            color: white;
        }
        .demo-users {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
        }
        .demo-user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .demo-user-item:last-child {
            border-bottom: none;
        }
        .demo-user-item:hover {
            background: #f0f7ff;
        }
        .demo-username {
            font-weight: 600;
            color: #2c3e50;
        }
        .demo-password {
            color: #7f8c8d;
            font-family: monospace;
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1><i class="fas fa-boxes"></i> ระบบจัดการสต็อก</h1>
            <p>กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>
        </div>
        
        <div class="login-box">
            <div class="status-indicator">
                <span id="onlineStatus" class="offline">
                    <i class="fas fa-wifi-slash"></i> โหมดออฟไลน์
                </span>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> ชื่อผู้ใช้</label>
                    <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> รหัสผ่าน</label>
                    <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required autocomplete="off">
                </div>
                
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
                </button>
            </form>
            
            <div class="demo-credentials">
                <h4><i class="fas fa-key"></i> บัญชีผู้ใช้ทั้งหมด:</h4>
                
                <div class="demo-users" id="userList">
                    <div class="text-center">กำลังโหลด...</div>
                </div>
                
                <p style="margin-top: 10px; font-size: 12px; color: #7f8c8d;">
                    <i class="fas fa-info-circle"></i> คลิกที่ชื่อผู้ใช้เพื่อเติมข้อมูลอัตโนมัติ
                </p>
            </div>
            
            <div class="login-footer">
                <p>© 2024 ระบบจัดการสต็อก | เวอร์ชัน 2.0</p>
            </div>
        </div>
        
        <div id="errorMessage" class="error-message" style="display: none;"></div>
    </div>
    
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            
            // ตรวจสอบสถานะออนไลน์
            checkOnlineStatus();
            
            // โหลดรายชื่อผู้ใช้
            refreshUserList();
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                
                if (!username || !password) {
                    showError('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
                    return;
                }
                
                const submitBtn = loginForm.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังเข้าสู่ระบบ...';
                submitBtn.disabled = true;
                
                try {
                    const staff = loadStaffUsers();
                    const user = staff.find(u => 
                        u.username.toLowerCase() === username.toLowerCase() && 
                        u.password === password &&
                        u.active !== false
                    );
                    
                    if (user) {
                        const userData = {
                            id: user.id,
                            username: user.username,
                            name: user.name,
                            role: user.role,
                            email: user.email,
                            phone: user.phone
                        };
                        
                        localStorage.setItem('user', JSON.stringify(userData));
                        localStorage.setItem('token', 'token-' + Date.now());
                        
                        showError('เข้าสู่ระบบสำเร็จ กำลังนำคุณไปยังหน้า...');
                        
                        setTimeout(() => {
                            window.location.href = 'sales.html';
                        }, 500);
                    } else {
                        showError('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showError('เกิดข้อผิดพลาดในการเข้าสู่ระบบ');
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            });
        });
        
        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            if (errorElement) {
                errorElement.textContent = message;
                errorElement.style.display = 'block';
                
                setTimeout(() => {
                    errorElement.style.display = 'none';
                }, 3000);
            }
        }
        
        function fillCredentials(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }
        
        function refreshUserList() {
            const userList = document.getElementById('userList');
            if (!userList) return;
            
            const staff = loadStaffUsers();
            const activeUsers = staff.filter(u => u.active !== false);
            
            if (activeUsers.length === 0) {
                userList.innerHTML = '<div class="text-center">ไม่มีบัญชีผู้ใช้</div>';
                return;
            }
            
            let html = '';
            activeUsers.forEach(user => {
                const roleClass = user.role === 'admin' ? 'role-admin' : 'role-staff';
                const roleText = user.role === 'admin' ? 'ผู้ดูแลระบบ' : 'พนักงานขาย';
                
                html += `
                    <div class="demo-user-item" onclick="fillCredentials('${user.username}', '${user.password}')">
                        <div>
                            <span class="demo-username">${user.username}</span>
                            <span class="role-badge ${roleClass}">${roleText}</span>
                        </div>
                        <div>
                            <span class="demo-password">${user.password}</span>
                        </div>
                    </div>
                `;
            });
            
            userList.innerHTML = html;
        }
        
        window.fillCredentials = fillCredentials;
        window.refreshUserList = refreshUserList;
    </script>
</body>
</html>
